<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BRAND_NAME}} - {{WEEK_LABEL}}</title>
    <style>
        /*__CSS_VARIABLES__*/
        :root {
            --background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 50%, #d8d8d8 100%);
            --text-color: #111111;
            --cta-bg: #111111;
            --cta-text: #ffffff;
            --accent-rose: #555555;
            --main-font: 'ITC Avant Garde Gothic Std', 'Century Gothic', 'Avant Garde', sans-serif;

            --glass-bg: rgba(0, 0, 0, 0.04);
            --glass-border: rgba(0, 0, 0, 0.15);
            --row-even-bg: rgba(0, 0, 0, 0.02);
            --header-bg: rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--background);
            color: var(--text-color);
            font-family: var(--main-font);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page-container {
            width: 210mm;
            height: 297mm;
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            text-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 30px;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.3);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .date-section {
            text-align: right;
        }

        .week-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        .date-range {
            font-size: 18px;
            font-weight: 600;
        }

        /* Menu Grid */
        .menu-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 100px 1.2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 2px;
        }

        .col-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .grid-header .col-title:nth-child(1) {
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* Day Rows */
        .day-row {
            display: grid;
            grid-template-columns: 100px 1.2fr 1fr 1fr;
            gap: 10px;
            padding: 12px 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            align-items: center;
        }

        .day-row:nth-child(even) {
            background: var(--row-even-bg);
        }

        .day-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(0, 0, 0, 0.15);
            padding-right: 10px;
            height: 100%;
        }

        .day-name {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-date {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .course-col {
            font-size: 11px;
            line-height: 1.4;
        }

        .course-col ul {
            list-style: none;
        }

        .course-col li {
            position: relative;
            padding-left: 12px;
            margin-bottom: 4px;
        }

        .course-col li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #111111;
            font-weight: bold;
            text-shadow: none;
        }

        /* Always Available Section */
        .always-available-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .always-available-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .always-available-list {
            margin-left: 20px;
            font-size: 11px;
            line-height: 1.5;
        }

        /* Footer / Info */
        footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 0px solid rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            border: 1px solid var(--glass-border);
        }

        .info-content h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
            padding-bottom: 5px;
        }

        .price-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px 12px;
        }

        .price-item {
            font-size: 10px;
            line-height: 1.3;
        }

        .accent-rose {
            color: var(--accent-rose);
        }

        .menu-wrapper {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
        }

        header,
        .footer {
            color: var(--text-color);
        }

        .cta {
            display: inline-block;
            background: var(--cta-bg);
            color: var(--cta-text);
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .section {
            border-bottom: 1px solid var(--section-border);
        }

        .footer {
            border-top: 1px solid var(--footer-border);
        }

        /* Eventuali altri selettori che usavano colori hardcoded dovrebbero usare var(--...) */
    </style>
</head>

<body>

    <div class="page-container">
        <div class="content-wrapper">
            <header>
                <div class="brand-section">
                    <img src="{{LOGO_SRC}}" alt="Logo" class="logo">
                    <div class="brand-name">{{BRAND_NAME}}</div>
                </div>
                <div class="date-section">
                    <div class="week-label">{{WEEK_LABEL}}</div>
                    <div class="date-range">{{DATE_RANGE}}</div>
                </div>
            </header>

            <div class="menu-grid">
                <div class="grid-header">
                    <div class="col-title">{{COL_1}}</div>
                    <div class="col-title">{{COL_2}}</div>
                    <div class="col-title">{{COL_3}}</div>
                    <div class="col-title">{{COL_4}}</div>
                </div>

                <!-- Generated Rows Inject Here -->
                {{DAYS_CONTENT}}

            </div>

            <!-- Always Available Section -->
            <div class="always-available-section">
                <div class="always-available-title">{{ALWAYS_AVAILABLE_TITLE}}</div>
                <ul class="always-available-list">
                    {{ALWAYS_AVAILABLE_ITEMS}}
                </ul>
            </div>

            <footer>
                <div class="info-card">
                    <div class="info-content">
                        <h3>{{PRICES_TITLE}}</h3>
                        <div class="price-list">
                            {{PRICE_LIST}}
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

</body>

</html>
